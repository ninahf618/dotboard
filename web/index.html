<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>タスクボード</title>
  </head>
  <body class="font-sans max-w-[640px] mx-auto p-4 bg-gray-50 text-gray-900">
    <h1 class="text-2xl font-bold tracking-tight mb-4">タスクボード</h1>
    <section>
      <h2 class="text-lg font-bold mb-2">タスク一覧</h2>
      <ul id="item-list" class="list-none p-0"></ul>
    </section>

    <section>
      <h2 class="text-lg font-bold mb-2">タスクを追加</h2>
      <form id="item-form" class="flex flex-wrap items-center gap-2 mb-6">
        <label class="text-sm text-gray-700">
          タイトル
          <input
            type="text"
            name="title"
            required
            class="rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-900"
          />
        </label>
        <label class="text-sm text-gray-700">
          メモ
          <textarea
            name="note"
            class="rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-900"
          ></textarea>
        </label>
        <label class="text-sm text-gray-700">
          優先度
          <select
            name="rating"
            class="rounded-md border border-gray-300 bg-white px-3 py-1.5 text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-gray-900"
          >
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </label>
        <button
          type="submit"
          class="rounded-md bg-gray-900 px-3 py-1.5 text-sm font-medium text-white hover:bg-gray-700"
        >
          追加する
        </button>
      </form>
    </section>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
